<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLARIZED // MATRIX</title>
<style>
/* ============================================================
   Solarized Dark — Brutalist Matrix Screensaver (PREVIEW)
   Aesthetic + palette extracted from "Inbox Triage V2" artifact.
   This standalone file is the visual reference. The Swift port
   (MatrixView.swift) reproduces the same effect in a .saver bundle.
   ============================================================ */
:root {
  /* Solarized dark base tones */
  --base03:#002b36; --base02:#073642; --base01:#586e75;
  --base00:#657b83; --base0:#839496;  --base1:#93a1a1;
  /* Solarized accents */
  --yellow:#b58900; --orange:#cb4b16; --red:#dc322f; --magenta:#d33682;
  --violet:#6c71c4; --blue:#268bd2;  --cyan:#2aa198; --green:#859900;
  color-scheme: dark;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden; background:var(--base03); }
#bg { position:fixed; inset:0; z-index:0; display:block; }

/* ---- Brutalist overlay: raw heavy monospace, hard rules ---- */
.overlay { position:fixed; inset:0; z-index:1; pointer-events:none;
  font-family:"SF Mono","Fira Code",ui-monospace,monospace; }
.frame { position:absolute; inset:18px; border:2px solid rgba(88,110,117,0.45); }
.tl, .br { position:absolute; color:var(--base1); text-transform:uppercase;
  letter-spacing:0.22em; font-weight:700; }
.tl { top:30px; left:34px; font-size:34px; line-height:1.05; color:var(--cyan); }
.tl small { display:block; font-size:12px; letter-spacing:0.35em; color:var(--base01);
  font-weight:400; margin-top:6px; }
.br { bottom:30px; right:34px; text-align:right; font-size:11px; letter-spacing:0.25em;
  color:var(--base01); }
.clock { position:absolute; bottom:28px; left:34px; font-size:13px; letter-spacing:0.3em;
  color:var(--green); font-weight:700; }
/* scanlines */
.scan { position:fixed; inset:0; z-index:2; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.18) 3px, rgba(0,0,0,0) 4px); mix-blend-mode:multiply; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="overlay">
  <div class="frame"></div>
  <div class="tl">MATRIX<small>SOLARIZED // DARK</small></div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="br">SYS.IDLE<br>RENDER 60FPS<br>v0.1</div>
</div>
<div class="scan"></div>

<script>
/* ============================================================
   Matrix rain — solarized accents, head-glyph highlight, fade trail.
   Tunables grouped at top so the Swift port stays 1:1.
   ============================================================ */
const CFG = {
  fontSize: 18,          // glyph cell size (px)
  fallMin: 0.45,         // min rows advanced per frame
  fallMax: 0.95,         // max rows advanced per frame
  fadeAlpha: 0.07,       // trail fade per frame (lower = longer trails)
  resetOdds: 0.975,      // when a column is off-screen, odds it keeps going
  headBright: '#eee8d5', // solarized base3 — bright leading glyph
};

// Glyph set: half-width katakana + code symbols (matrix + "source rain" feel)
const KATA = [];
for (let c = 0xFF66; c <= 0xFF9D; c++) KATA.push(String.fromCharCode(c));
const CODE = '{}[]()<>=!+-*/&|^~;:.01#$%@\\/_'.split('');
const GLYPHS = KATA.concat(CODE, CODE);
const rc = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

// Solarized accent ramp for column body glyphs
const STREAM = ['#2aa198','#268bd2','#859900','#6c71c4','#b58900'];

const cv = document.getElementById('bg');
const ctx = cv.getContext('2d');
let W, H, cols, drops, colColor, colChar;

function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
  cols = Math.floor(W / CFG.fontSize);
  drops    = Array.from({length: cols}, () => Math.random() * -50);
  colColor = Array.from({length: cols}, (_, i) => STREAM[i % STREAM.length]);
  colChar  = Array.from({length: cols}, rc);
}

function draw() {
  // fade prior frame toward base03 for the trailing tail
  ctx.fillStyle = 'rgba(0,43,54,' + CFG.fadeAlpha + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.font = '600 ' + CFG.fontSize + 'px "SF Mono","Fira Code",monospace';
  ctx.textBaseline = 'top';

  for (let i = 0; i < cols; i++) {
    const x = i * CFG.fontSize;
    const y = drops[i] * CFG.fontSize;

    // occasionally mutate the column's resident glyph
    if (Math.random() > 0.92) colChar[i] = rc();

    // body glyph in solarized accent
    ctx.fillStyle = colColor[i];
    ctx.fillText(colChar[i], x, y);
    // bright head one cell ahead
    ctx.fillStyle = CFG.headBright;
    ctx.fillText(rc(), x, y + CFG.fontSize);

    drops[i] += CFG.fallMin + Math.random() * (CFG.fallMax - CFG.fallMin);

    if (y > H && Math.random() > CFG.resetOdds) {
      drops[i] = Math.random() * -20;
      colColor[i] = STREAM[(Math.random() * STREAM.length) | 0];
      colChar[i] = rc();
    }
  }
  requestAnimationFrame(draw);
}

function tick() {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.toLocaleTimeString('en-US', { hour12: false });
}
setInterval(tick, 1000); tick();

window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>
